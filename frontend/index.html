<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFL IG Tracker — Follow &amp; Unfollow Activity</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Favicon placeholder -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>" />
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-icon">🏈</span>
      <div>
        <h1>NFL IG Tracker</h1>
        <p class="tagline">Real-time Instagram follow activity for NFL players</p>
      </div>
    </div>
    <div class="header-stats" id="headerStats">
      <div class="stat-chip"><span id="statPlayers">—</span><label>Players</label></div>
      <div class="stat-chip"><span id="statFollows">—</span><label>Follows</label></div>
      <div class="stat-chip"><span id="statUnfollows">—</span><label>Unfollows</label></div>
    </div>
  </div>
</header>

<!-- ===== MAIN ===== -->
<main class="main-layout">

  <!-- ── LEFT: Player sidebar ── -->
  <aside class="sidebar">
    <div class="search-box">
      <input
        id="playerSearch"
        type="text"
        placeholder="Search players, teams…"
        autocomplete="off"
      />
      <span class="search-icon">&#128269;</span>
    </div>

    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="QB">QB</button>
      <button class="filter-btn" data-filter="WR">WR</button>
      <button class="filter-btn" data-filter="RB">RB</button>
      <button class="filter-btn" data-filter="TE">TE</button>
      <button class="filter-btn" data-filter="DEF">DEF</button>
    </div>

    <div id="playerList" class="player-list">
      <div class="loading-spinner">Loading players…</div>
    </div>
  </aside>

  <!-- ── RIGHT: Feed ── -->
  <section class="feed-section">

    <!-- Tab bar (shown when a player is selected) -->
    <div class="feed-header" id="feedHeader">
      <div id="feedTitle" class="feed-title">
        <span>Recent Activity</span>
        <small id="feedSubtitle">All players · latest follows &amp; unfollows</small>
      </div>
      <div class="feed-controls">
        <div class="type-toggle">
          <button class="type-btn active" data-type="all">All</button>
          <button class="type-btn follow" data-type="follow">Follows</button>
          <button class="type-btn unfollow" data-type="unfollow">Unfollows</button>
        </div>
        <button id="backBtn" class="back-btn hidden">← All Players</button>
      </div>
    </div>

    <div id="feed" class="feed">
      <div class="loading-spinner">Loading activity…</div>
    </div>

    <div id="loadMore" class="load-more hidden">
      <button id="loadMoreBtn">Load more</button>
    </div>
  </section>

</main>

<!-- ===== PLAYER DETAIL MODAL ===== -->
<div id="playerModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-card">
    <button class="modal-close" id="modalClose" aria-label="Close">&#10005;</button>
    <div id="modalContent"></div>
  </div>
</div>

<footer class="site-footer">
  <p>
    Data refreshed every 6 hours &nbsp;·&nbsp;
    Follow us on X: <a href="https://x.com" target="_blank" rel="noopener">@NFLIGTracker</a>
    &nbsp;·&nbsp;
    Instagram handles are best-effort accurate
  </p>
</footer>

<script src="app.js"></script>
</body>
</html>
